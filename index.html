<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DIANA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Layout: sticky header + tab bar, grouped work lists down one column, card detail in a right-hand drawer. Tokens follow the integrated site mockup. */
:root{
  --bg:#F5F7FB; --sf:#FFFFFF; --sf2:#F0F3F9; --t:#0F1729; --t2:#4A5568; --t3:#75839B;
  --b:rgba(15,23,41,.10); --b2:rgba(15,23,41,.06);
  --a:#4F6EF7; --al:rgba(79,110,247,.10); --ah:#3B5AE0; --on-a:#FFFFFF;
  --g:#0B8A5E; --gb:rgba(13,155,106,.12);
  --am:#9A6C00; --ab:rgba(176,125,0,.14);
  --r:#C93516; --rb:rgba(220,62,27,.11);
  --p:#6B4AE8; --pb:rgba(124,92,252,.12);
  --tl:#0D7490; --tb:rgba(13,116,144,.12);
  --in:#4338CA; --ib:rgba(67,56,202,.10);
  --sh:0 1px 3px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03); --sm:0 12px 40px rgba(15,23,41,.16);
  --hdr:rgba(255,255,255,.86); --scrim:rgba(15,23,41,.32);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --pad:clamp(16px,3vw,32px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1220; --sf:#151C2E; --sf2:#1B243A; --t:#E8ECF5; --t2:#AAB4C8; --t3:#7F8BA3;
  --b:rgba(255,255,255,.12); --b2:rgba(255,255,255,.07);
  --a:#7F97FF; --al:rgba(127,151,255,.16); --ah:#9DB0FF; --on-a:#0D1220;
  --g:#3CCB97; --gb:rgba(60,203,151,.16); --am:#E5B542; --ab:rgba(229,181,66,.16);
  --r:#FF7A5C; --rb:rgba(255,122,92,.16); --p:#A891FF; --pb:rgba(168,145,255,.16);
  --tl:#4FC3DD; --tb:rgba(79,195,221,.15); --in:#9A93FF; --ib:rgba(154,147,255,.15);
  --sh:0 0 0 1px rgba(255,255,255,.07); --sm:0 12px 40px rgba(0,0,0,.5);
  --hdr:rgba(21,28,46,.9); --scrim:rgba(0,0,0,.55); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1220; --sf:#151C2E; --sf2:#1B243A; --t:#E8ECF5; --t2:#AAB4C8; --t3:#7F8BA3;
  --b:rgba(255,255,255,.12); --b2:rgba(255,255,255,.07);
  --a:#7F97FF; --al:rgba(127,151,255,.16); --ah:#9DB0FF; --on-a:#0D1220;
  --g:#3CCB97; --gb:rgba(60,203,151,.16); --am:#E5B542; --ab:rgba(229,181,66,.16);
  --r:#FF7A5C; --rb:rgba(255,122,92,.16); --p:#A891FF; --pb:rgba(168,145,255,.16);
  --tl:#4FC3DD; --tb:rgba(79,195,221,.15); --in:#9A93FF; --ib:rgba(154,147,255,.15);
  --sh:0 0 0 1px rgba(255,255,255,.07); --sm:0 12px 40px rgba(0,0,0,.5);
  --hdr:rgba(21,28,46,.9); --scrim:rgba(0,0,0,.55); color-scheme:dark }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--t);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--a);text-decoration:none} a:hover{color:var(--ah);text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:var(--pad)}
.num{font-variant-numeric:tabular-nums}

.demo{background:var(--t);color:var(--bg);font-size:11.5px;padding:7px var(--pad);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo b{font:700 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--a);color:var(--on-a);padding:3px 7px;border-radius:4px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--b)}
.hdr .wrap{display:flex;align-items:center;gap:14px;min-height:54px;flex-wrap:wrap;padding-block:6px}
.logo{font-weight:700;font-size:15px;letter-spacing:-.3px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo i{font:700 10px/1 var(--mono);font-style:normal;background:var(--al);color:var(--a);padding:5px 6px;border-radius:5px}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--t2);font-size:12.5px;font-weight:500;padding:7px 10px;border-radius:8px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button:hover{background:var(--b2);color:var(--t)}
.tabs button[aria-selected="true"]{color:var(--a);background:var(--al);box-shadow:inset 0 0 0 1px var(--al)}
.tabs b{font:700 10px var(--mono);background:var(--b2);padding:1px 6px;border-radius:4px;color:var(--t2)}
.tabs button[aria-selected="true"] b{background:var(--a);color:var(--on-a)}
.user{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t3);white-space:nowrap}
.live{width:7px;height:7px;border-radius:50%;background:var(--g)}
.av{width:26px;height:26px;border-radius:50%;background:var(--al);color:var(--a);display:inline-grid;place-items:center;font:700 10px/1 var(--mono);flex:none}
.av.cov{box-shadow:0 0 0 2px var(--sf),0 0 0 3.5px var(--am)}
.av.none{background:var(--b2);color:var(--t3)}
.btn{border:1px solid var(--b);background:var(--sf);border-radius:8px;padding:6px 11px;font-weight:600;font-size:12px;color:var(--t2);white-space:nowrap}
.btn:hover{color:var(--t);border-color:var(--t3)}
.btn.pri{background:var(--a);border-color:var(--a);color:var(--on-a)} .btn.pri:hover{background:var(--ah);color:var(--on-a)}
.btn.sm{padding:4px 8px;font-size:11.5px}
.btn[disabled]{opacity:.5;cursor:default}

main{padding-block:20px 60px}
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:20px;letter-spacing:-.4px;font-weight:700;text-wrap:balance}
.top p{color:var(--t2);max-width:65ch}
.top .sp{flex:1}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font:700 18px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);font-weight:600}
.stat.warn b{color:var(--r)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--b);background:var(--sf);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--t2);display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--al);border-color:var(--a);color:var(--a)}
.chip small{font:700 10px var(--mono)}
.filters input[type=search],.filters select{border:1px solid var(--b);background:var(--sf);border-radius:8px;padding:6px 10px;min-width:0;width:min(260px,100%)}
.filters .sep{width:1px;height:18px;background:var(--b);margin-inline:4px}

.grp{margin-bottom:18px}
.grp h2{font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--gc,var(--t))}
.grp h2 span{font:700 10px var(--mono);color:var(--t3)}
.list{background:var(--sf);border-radius:10px;box-shadow:var(--sh);overflow:hidden;border-left:3px solid var(--gc,var(--b))}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) 150px 92px 34px 74px;gap:10px;align-items:center;padding:8px 12px 8px 8px;border-top:1px solid var(--b2);cursor:pointer;width:100%;text-align:left;background:none;border-inline:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:var(--sf2)}
.row.sel{background:var(--al)}
.row .ti{min-width:0}
.row .ti b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ti small{color:var(--t3);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.fin .ti b{color:var(--t2);font-weight:500}
.tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--t3);background:var(--sf);display:grid;place-items:center;color:transparent;font-size:13px;font-weight:700;line-height:1;padding:0}
.tick:hover{border-color:var(--g);color:var(--g)}
.tick.on{background:var(--g);border-color:var(--g);color:var(--sf)}
.tick.ver{background:var(--a);border-color:var(--a);color:var(--on-a)}
.tick.na{border-style:dashed;cursor:default}
.tick.na:hover{border-color:var(--t3);color:transparent}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:100%;background:var(--b2);color:var(--t2)}
.pill{font:700 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 0;border-radius:5px;text-align:center;display:block}
.pill.open{background:var(--al);color:var(--a)} .pill.done{background:var(--gb);color:var(--g)}
.pill.verified{background:var(--a);color:var(--on-a)} .pill.stuck{background:var(--rb);color:var(--r)}
.due{font-size:11.5px;color:var(--t3);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.due.late{color:var(--r);font-weight:600}
.empty{background:var(--sf);border:1px dashed var(--b);border-radius:10px;padding:28px 20px;text-align:center;color:var(--t2)}
.empty b{display:block;color:var(--t);font-size:14px;margin-bottom:4px}

.tw{background:var(--sf);border-radius:10px;box-shadow:var(--sh);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--b);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--b2);vertical-align:top}
tr:first-child td{border-top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--t3);font-size:11.5px}
.cov-reported{background:var(--gb);color:var(--g)} .cov-awaiting_decision{background:var(--ab);color:var(--am)}
.cov-write_requested{background:var(--pb);color:var(--p)} .cov-logged_only{background:var(--b2);color:var(--t2)} .cov-excluded{background:var(--rb);color:var(--r)}
.addf{border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--sf)} .addf h2{font-size:14px;margin:0 0 10px} .addf .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px} .addf label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;color:var(--t2)} .addf input,.addf select{border:1px solid var(--b);border-radius:8px;padding:7px 9px;background:var(--bg);color:var(--t);font:inherit;font-weight:400;min-width:0} .addf .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px} .addf .hint{font-size:11.5px;color:var(--t2)}
.asg{max-width:112px;cursor:pointer} .qn{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:14px;background:var(--pb);color:var(--p);font-weight:700;font-size:13px} tr.next .qn{background:var(--a);color:var(--on-a)} tr.next td{background:color-mix(in srgb,var(--a) 6%,transparent)} h2.sec{font-size:15px;margin:22px 0 10px}
.rm{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px} .rm input{flex:1;min-width:150px;border:1px solid var(--b);border-radius:8px;padding:6px 9px;background:var(--bg)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:22px}
.person{background:var(--sf);border-radius:10px;box-shadow:var(--sh);padding:12px;display:flex;gap:10px;align-items:center}
.person b{display:block} .person small{color:var(--t3)}
.person.away{box-shadow:0 0 0 1.5px var(--am)}
h3{font-size:13px;margin:0 0 8px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--sf);z-index:31;box-shadow:var(--sm);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{padding:16px 18px 12px;border-bottom:1px solid var(--b);display:flex;gap:10px;align-items:flex-start}
.dh h2{font-size:16px;letter-spacing:-.2px;flex:1;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.dh .x{border:0;background:var(--b2);width:28px;height:28px;border-radius:8px;font-size:15px;color:var(--t2);flex:none}
.db{overflow-y:auto;padding:14px 18px 24px;display:flex;flex-direction:column;gap:16px;flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec>h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);font-weight:600;margin-bottom:6px}
.sec p{overflow-wrap:anywhere;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px}
.kv dt{color:var(--t3)} .kv dd{overflow-wrap:anywhere}
.qa{list-style:none;display:flex;flex-direction:column;gap:5px}
.qa li{background:var(--ab);color:var(--am);border-radius:6px;padding:6px 9px;font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ask{background:var(--tb);color:var(--tl);border-radius:8px;padding:9px 11px;font-weight:500}
.files{list-style:none;display:flex;flex-direction:column;gap:4px}
.files li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.files small,.log small{color:var(--t3)}
.up{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.up select,.cm textarea,.dn textarea,.login input{border:1px solid var(--b);background:var(--bg);border-radius:8px;padding:7px 9px;min-width:0}
.cm{display:flex;gap:6px;margin-top:8px} .cm textarea{flex:1;resize:vertical;min-height:36px}
.log{list-style:none;display:flex;flex-direction:column;gap:7px}
.log li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px}
.log p{white-space:pre-wrap;overflow-wrap:anywhere}
.hist{list-style:none;color:var(--t2);font-size:12px;display:flex;flex-direction:column;gap:3px}
.dn{display:flex;flex-direction:column;gap:8px} .dn textarea{width:100%;min-height:36px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--t);color:var(--bg);padding:9px 14px;border-radius:9px;font-weight:500;z-index:50;box-shadow:var(--sm);max-width:calc(100% - 32px)}
.toast.err{background:var(--r);color:#fff}
.login{max-width:400px;margin:9vh auto 0;background:var(--sf);border-radius:14px;box-shadow:var(--sh);padding:26px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:19px;letter-spacing:-.3px} .login p{color:var(--t2)} .login input{width:100%;padding:9px 11px}
.login label{font-weight:600;font-size:12px;display:flex;flex-direction:column;gap:5px}
.login .msg{background:var(--al);color:var(--a);border-radius:8px;padding:9px 11px;font-weight:500}
.login .msg.err{background:var(--rb);color:var(--r)}
@media (max-width:760px){
  .row{grid-template-columns:30px minmax(0,1fr) 78px 30px;row-gap:2px}
  .row .tg,.row .due{display:none}
  .row .ti b{white-space:normal}
  .user .nm{display:none}
}
@media (prefers-reduced-motion:no-preference){ .drawer{animation:in .16s ease-out} @keyframes in{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}} }

/* ---- look of the integrated M&A Monitor site ---- */
:root{--grid:rgba(0,0,0,.02);--glass2:rgba(255,255,255,.86);--mesh1:rgba(79,110,247,.09);--mesh2:rgba(124,92,252,.06);--glow:0 2px 14px rgba(79,110,247,.28);--tile:#FFFFFF}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--grid:rgba(255,255,255,.025);--glass2:rgba(21,28,46,.9);--mesh1:rgba(127,151,255,.10);--mesh2:rgba(168,145,255,.07);--glow:0 2px 14px rgba(127,151,255,.22);--tile:#FFFFFF} }
:root[data-theme="dark"]{--grid:rgba(255,255,255,.025);--glass2:rgba(21,28,46,.9);--mesh1:rgba(127,151,255,.10);--mesh2:rgba(168,145,255,.07);--glow:0 2px 14px rgba(127,151,255,.22);--tile:#FFFFFF}
body{position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:80px 80px}
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.mesh::before{content:"";position:absolute;top:-30%;left:-20%;width:70%;height:70%;background:radial-gradient(var(--mesh1) 0%,transparent 65%)}
.mesh::after{content:"";position:absolute;bottom:-30%;right:-15%;width:60%;height:60%;background:radial-gradient(var(--mesh2) 0%,transparent 65%)}
#app{position:relative;z-index:1}
.hdr{backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4)}
.hdr .wrap{max-width:none;min-height:56px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .co{height:30px;width:auto;border-radius:5px;display:block;box-shadow:0 1px 4px rgba(15,23,41,.18)}
.brand .cn{font-weight:700;font-size:15px;letter-spacing:-.3px}
.brand .dv{width:1px;height:26px;background:var(--b);margin-inline:4px}
.brand .dm{height:32px;width:32px;border-radius:8px;background:var(--tile);box-shadow:var(--sh);display:grid;place-items:center;flex:none}
.brand .dm img{height:26px;width:auto;display:block}
.brand .dn{display:flex;flex-direction:column;line-height:1.05}
.brand .dn b{font-weight:800;font-size:15px;letter-spacing:.06em;color:var(--a)}
.brand .dn small{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3)}
.tabs{justify-content:flex-start}
.tabs button{padding:7px 9px;transition:.2s}
.tabs button[aria-selected="true"]{box-shadow:inset 0 0 0 1px rgba(79,110,247,.18)}
.top{align-items:flex-end;margin-bottom:18px;padding-top:14px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin-bottom:8px}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.1;background:linear-gradient(135deg,var(--t) 35%,var(--a) 110%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--t);padding-bottom:2px}
.top p{font-size:14px;line-height:1.55;margin-top:8px;max-width:62ch}
.stats{gap:8px}
.stat{background:var(--glass2);border:1px solid var(--b);border-radius:10px;box-shadow:var(--sh);padding:10px 14px;min-width:104px}
.stat b{font:700 21px/1.1 var(--mono)}
.stat span{font-size:9px;font-weight:700;letter-spacing:.07em;margin-top:4px}
.stat.ok b{color:var(--g)} .stat.amb b{color:var(--am)}
.btn{border-radius:8px;transition:.2s;background:var(--glass2);box-shadow:var(--sh);border-color:transparent;color:var(--t)}
.btn:hover{color:var(--a);border-color:transparent}
.btn.pri{background:var(--a);color:var(--on-a);box-shadow:var(--glow);padding:9px 16px;font-size:12.5px}
.btn.pri:hover{background:var(--ah);color:var(--on-a);transform:translateY(-1px)}
.chip{border-radius:7px;padding:6px 10px;background:var(--glass2)}
.filters input[type=search],.filters select,td select{border-radius:8px;padding:8px 10px;font-weight:500;font-size:12.5px;background:var(--glass2);border:1px solid var(--b)}
.filters input[type=search]:focus,.filters select:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px var(--al)}
.grp{margin-bottom:22px}
.grp h2{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.grp h2::after{content:"";flex:1;height:1px;background:var(--b)}
.grp h2 span{font:700 10px var(--mono);background:var(--b2);padding:1px 6px;border-radius:4px;color:var(--t2)}
.list{background:var(--glass2);border:1px solid var(--b);border-left:3px solid var(--gc,var(--b));border-radius:12px;box-shadow:var(--sh)}
.row{padding:11px 16px 11px 12px;transition:background .15s}
.row:hover{background:var(--al)}
.row .ti b{font-size:13px;letter-spacing:-.1px}
.pill{font:700 10.5px/1 var(--sans);letter-spacing:0;text-transform:none;padding:5px 0;border-radius:5px}
.pill.open{background:var(--al);color:var(--a)} .pill.verified{background:var(--a);color:var(--on-a)}
.tag{border-radius:5px;font-size:10.5px;font-weight:700}
.tw{background:var(--glass2);border:1px solid var(--b);border-radius:12px;box-shadow:var(--sh)}
th{background:var(--b2);font-size:9px;font-weight:700;padding:10px 10px}
td{padding:11px 10px}
th:first-child,td:first-child{padding-left:16px} th:last-child,td:last-child{padding-right:16px}
tbody tr{transition:background .15s} tbody tr:hover{background:var(--al)}
td b{letter-spacing:-.1px}
.person{background:var(--glass2);border:1px solid var(--b);border-radius:12px}
h3{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);display:flex;align-items:center;gap:8px;margin:22px 0 8px}
h3::after{content:"";flex:1;height:1px;background:var(--b)}
.empty{background:var(--glass2);border-radius:12px}
.drawer{background:var(--sf)}
.dh h2{font-size:18px;font-weight:800;letter-spacing:-.03em}
.login{align-items:center;text-align:center;border:1px solid var(--b);border-radius:16px;padding:30px 28px;max-width:420px;background:var(--glass2);margin-top:7vh}
.login .dl{background:var(--tile);border-radius:14px;padding:14px 22px;box-shadow:var(--sh)}
.login .dl img{height:150px;width:auto;display:block}
.login .sub{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
.login h1{font-size:22px;font-weight:800;letter-spacing:-.03em}
.login form,.login label{width:100%;text-align:left}
.login form{display:flex;flex-direction:column;gap:12px}
.login .by{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:11.5px;margin-top:6px}
.login .by img{height:24px;border-radius:4px;box-shadow:0 1px 4px rgba(15,23,41,.18)}
.demo{position:relative;z-index:2}
@media (max-width:900px){ .brand .cn,.brand .dv,.brand .dn small{display:none} .top h1{font-size:25px} }
@media (prefers-reduced-motion:reduce){ .btn.pri:hover{transform:none} }
</style>

const fmtDT = d => d ? new Date(d).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/London" }) : "";
const fmtN = n => n == null ? "" : Number(n).toLocaleString("en-GB", { maximumFractionDigits: 1 });

const isManager = () => S.me && (S.me.role === "lead" || S.me.role === "deputy");

let toastT; function toast(m, err) { const t = $("#toast"); t.textContent = m; t.className = "toast" + (err ? " err" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 6000 : 2600); }
const errMsg = e => (e && (e.message || e.error_description)) || "Something went wrong. Try again.";

/* ---------- data layer: live (Supabase) ---------- */
const liveApi = {
  async load() {
    const t = today(), since = new Date(Date.now() - 14 * 864e5).toISOString(), d60 = new Date(Date.now() - 60 * 864e5).toISOString().slice(0, 10);
    const dcols = "id,deal_number,temp_id,target,bidder,seller,target_country,region,is_public,sector,deal_type,deal_status,is_pending,admin_state,coverage_status,reason_not_covered,value,currency,value_eur,fx_rate,fx_date,date_announced,date_found,source_url,owner_id,exported_at,export_path,writing_note,urgent_at,writing_started_at,review_due,last_reviewed,review_note";
    const [team, abs, rules, cards, deals] = await Promise.all([
      sb.from("team_members").select("*").eq("active", true).order("name"),
      sb.from("absences").select("*").gte("end_date", t).order("start_date"),
      sb.from("routing_rules").select("*").order("id"),
      sb.from("cards").select("*").or(`status.in.(open,stuck),created_at.gte.${since},done_at.gte.${since}`).order("created_at", { ascending: false }).limit(3000),
      sb.from("deals").select(dcols).or(`is_pending.eq.true,date_found.gte.${d60}`).order("date_found", { ascending: false }).limit(4000)
    ]);
    for (const r of [team, abs, rules, cards, deals]) if (r.error) throw r.error;
    const map = {}; deals.data.forEach(d => map[d.id] = d);
    const missing = [...new Set(cards.data.map(c => c.deal_id).filter(id => id && !map[id]))];
    if (missing.length) { const r = await sb.from("deals").select(dcols).in("id", missing); if (!r.error) r.data.forEach(d => map[d.id] = d); }
    return { team: team.data, absences: abs.data, rules: rules.data, cards: cards.data, deals: map };
  },
  async detail(id) {
    const [cm, hi, fi] = await Promise.all([
      sb.from("card_comments").select("*").eq("card_id", id).order("created_at"),
      sb.from("card_history").select("*").eq("card_id", id).order("at"),
      sb.from("card_files").select("*").eq("card_id", id).order("uploaded_at")
    ]);
    const files = fi.data || [];
    if (files.length) {
      const r = await sb.storage.from(BUCKET).createSignedUrls(files.map(f => f.path), 3600);
      if (r.data) r.data.forEach((u, i) => files[i].url = u.signedUrl);
    }
    let draft = null; const card = S.cards.find(c => c.id === id);
    if (card && card.deal_id && (card.type === "report_check" || card.type === "final_check")) {
      const dr = await sb.from("report_drafts").select("content,folder,reviewer_note,created_at,uploaded_at,upload_result").eq("deal_id", card.deal_id).order("created_at", { ascending: false }).limit(1);
      if (dr.data && dr.data[0]) draft = dr.data[0];
    }
    return { comments: cm.data || [], history: hi.data || [], files, draft };
  },
  rpc: async (fn, args) => { const { error } = await sb.rpc(fn, args); if (error) throw error; },
  setStatus: (id, s) => liveApi.rpc("set_card_status", { p_card: id, p_status: s }),
  pick: id => liveApi.rpc("pick_card", { p_card: id }),

  requestReport: id => liveApi.rpc("request_report", { p_deal: id }),
  excludeDeal: (id, reason) => liveApi.rpc("exclude_deal", { p_deal: id, p_reason: reason || null }),
  restoreDeal: id => liveApi.rpc("restore_deal", { p_deal: id }),

  addDeal: f => liveApi.rpc("add_deal", { p_target: f.target, p_bidder: f.bidder || null, p_seller: f.seller || null, p_country: f.country, p_public: f.kind === "public", p_value: f.value === "" || f.value == null ? null : Number(f.value), p_currency: f.currency || null, p_date: f.date || null, p_url: f.url || null, p_action: f.action }),
  writeNow: id => liveApi.rpc("write_now", { p_deal: id }),
  setDealOwner: (id, m) => liveApi.rpc("set_deal_owner", { p_deal: id, p_member: m }),

  async pdfText(file) {
    // read the PDF's text in the browser so DIANA can check the report after upload
    try {
      if (!window.pdfjsLib) await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; const out = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const tc = await (await pdf.getPage(p)).getTextContent(); let line = "", y = null;
        for (const it of tc.items) { const iy = Math.round(it.transform[5]); if (y !== null && Math.abs(iy - y) > 2) { out.push(line.trimEnd()); line = ""; } line += it.str + (it.hasEOL ? "" : " "); y = iy; }
        out.push(line.trimEnd());
      }
      return out.join("\n").replace(/[ \t]+/g, " ").slice(0, 400000);
    } catch (e) { return null; }
  },
  async attach(id, file, kind) {

      ${c.qa_flags && c.qa_flags.length ? `<div class="sec"><h4>QA flags</h4><ul class="qa">${c.qa_flags.map(f => `<li>${esc(typeof f === "string" ? f : JSON.stringify(f))}</li>`).join("")}</ul></div>` : ""}
      ${x && x.draft ? `<div class="sec"><h4>Draft report</h4><p style="color:var(--t2)">Written ${esc(fmtDT(x.draft.created_at))}${x.draft.folder ? " · files in " + esc(x.draft.folder) : ""}${x.draft.uploaded_at ? " · uploaded " + esc(fmtDT(x.draft.uploaded_at)) : ""}</p>${x.draft.reviewer_note ? `<p class="ask" style="margin-top:6px">Independent review: ${esc(x.draft.reviewer_note)}</p>` : ""}${x.draft.upload_result ? `<p style="margin-top:6px">Upload: ${esc(x.draft.upload_result)}</p>` : ""}<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600;color:var(--a)">Read the draft (${Math.round(x.draft.content.length / 1000)}k characters)</summary><div class="acts" style="margin:8px 0"><button class="btn sm" data-copydraft>Copy the text</button></div><pre id="drafttext" style="white-space:pre-wrap;overflow-wrap:anywhere;font:500 11.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:12px;max-height:60vh;overflow:auto">${esc(x.draft.content)}</pre></details></div>` : ""}
      ${d ? `<div class="sec"><h4>Deal</h4><dl class="kv"><dt>Number</dt><dd>${esc(d.deal_number || "Not yet assigned")}</dd><dt>Target</dt><dd>${esc(d.target)}${d.target_country ? " (" + esc(d.target_country) + ")" : ""}</dd>${d.bidder ? `<dt>Bidder</dt><dd>${esc(d.bidder)}</dd>` : ""}${d.seller ? `<dt>Seller</dt><dd>${esc(d.seller)}</dd>` : ""}<dt>Type</dt><dd>${d.is_public ? "Public" : esc(d.deal_type || "Private")} · ${esc(REGIONS[d.region] || "Region not set")}</dd>${d.value != null ? `<dt>Value</dt><dd>${esc((d.currency || "") + " " + fmtN(d.value) + "m")}</dd>` : ""}<dt>Last export</dt><dd>${d.exported_at ? esc(fmtDT(d.exported_at)) : "None yet"}</dd></dl></div>` : ""}
      <div class="sec"><h4>Files</h4>${x ? (x.files.length ? `<ul class="files">${x.files.map(f => `<li>${safeUrl(f.url) ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>` : `<span>${esc(f.name)}</span>`}<small>${esc(KINDS[f.kind] || f.kind)} · ${esc(f.uploaded_by || "")} · ${esc(fmtDT(f.uploaded_at))}</small></li>`).join("")}</ul>` : `<p style="color:var(--t3)">Nothing attached.</p>`) : `<p style="color:var(--t3)">Loading…</p>`}
        ${canEdit() ? `<div class="up"><select id="fkind" aria-label="File type">${Object.entries(KINDS).map(([k, l]) => `<option value="${k}"${k === defKind ? " selected" : ""}>${l}</option>`).join("")}</select><input type="file" id="ffile" hidden><button class="btn sm" data-upload>Attach a file</button></div>` : ""}</div>
      ${mgr ? `<div class="sec"><h4>Reassign</h4><div class="up"><select id="rto" aria-label="Reassign to">${S.team.map(m => `<option value="${esc(m.id)}"${m.id === c.assignee_id ? " selected" : ""}>${esc(m.name)}${isAway(m.id) ? " (away)" : ""}</option>`).join("")}</select><button class="btn sm" data-reassign>Reassign</button></div></div>` : ""}
      <div class="sec"><h4>Comments</h4>${x && x.comments.length ? `<ul class="log">${x.comments.map(m => { const tm = S.team.find(t => t.name === m.author); return `<li>${tm ? avatar(tm.id) : `<span class="av none">·</span>`}<div><b>${esc(m.author)}</b> <small>${esc(fmtDT(m.created_at))}</small><p>${esc(m.body)}</p></div></li>`; }).join("")}</ul>` : ""}
        ${canEdit() ? `<div class="cm"><textarea id="cbody" rows="1" placeholder="Add a comment" aria-label="Comment"></textarea><button class="btn sm" data-comment>Post</button></div>` : ""}</div>
      <div class="sec"><h4>History</h4><ul class="hist">${x ? x.history.map(h => `<li><b>${esc(h.actor)}</b> · ${esc(h.action)} · ${esc(fmtDT(h.at))}</li>`).join("") : ""}</ul></div>
    </div></aside>`;
}

function loginHtml() {
  return `<div class="wrap"><div class="login"><div class="dl"><img src="${LOGO.full}" alt="DIANA"></div><div class="sub">Deal ID and Notification App</div><h1>Sign in to DIANA</h1><p>Use your work email. We'll send you a sign-in link; no password needed.</p>
    <form id="login"><label>Work email<input type="email" id="lemail" required autocomplete="email" placeholder="name@ma-monitor.co.uk"></label>
    ${S.authMsg ? `<div class="msg${S.authMsg.err ? " err" : ""}">${esc(S.authMsg.text)}</div>` : ""}
    <button class="btn pri" type="submit">Email me a sign-in link</button></form>
    <div class="by"><img src="${LOGO.co}" alt=""><span>M&amp;A Monitor Ltd · team access only</span></div></div></div>`;
}
function render() {
  const app = $("#app");
  if (LIVE && !S.session) { app.innerHTML = loginHtml(); return; }
  if (LIVE && S.session && !S.me) {
    app.innerHTML = `<div class="wrap"><div class="login"><h1>${S.loading ? "Loading…" : "This email isn't on DIANA"}</h1>${S.loading ? "" : `<p>${esc(S.session.user.email)} is signed in but hasn't been added to the team list. Ask Phil to add it.</p><button class="btn" id="signout">Sign out</button>`}</div></div>`; return;
  }
  if (!S.me) return;
  const keep = document.activeElement && document.activeElement.id === "q" ? document.activeElement.selectionStart : null;
  const myOpen = S.cards.filter(c => c.assignee_id === S.me.id && activeOnly(c)).length;
  const queue = S.cards.filter(c => c.type === "report_check" && !c.owner_id && c.status === "open").length;
  const badge = { mywork: myOpen, tocheck: queue, all: S.cards.filter(activeOnly).length, queue: Object.values(S.deals).filter(d => d.coverage_status === "write_requested" && !d.deal_number).length };
  const view = { mywork: viewMyWork, all: viewAll, tocheck: viewToCheck, pending: viewPending, found: viewFound, queue: viewQueue, team: viewTeam }[S.tab]();
  app.innerHTML = `${LIVE ? "" : `<div class="demo" role="note"><b>Example data</b><span>These companies and cards are made up to show how DIANA works. View it as:</span><select id="viewas" aria-label="View as" style="background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:2px 6px">${S.team.map(m => `<option value="${esc(m.id)}"${m.id === S.me.id ? " selected" : ""}>${esc(m.name)}</option>`).join("")}</select></div>`}
  <header class="hdr"><div class="wrap"><div class="brand"><img class="co" src="${LOGO.co}" alt="M&amp;A Monitor"><span class="cn">M&amp;A Monitor</span><span class="dv"></span><span class="dm"><img src="${LOGO.head}" alt=""></span><span class="dn"><b>DIANA</b><small>Deal ID and Notification App</small></span></div>
    <nav class="tabs" role="tablist">${TABS.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}${badge[k] ? ` <b>${badge[k]}</b>` : ""}</button>`).join("")}</nav>
    <div class="user">${LIVE ? `<span class="live" title="Live updates on"></span>` : ""}<span class="nm">${esc(S.me.name)}${canEdit() ? "" : " (view only)"}</span>${avatar(S.me.id)}${LIVE ? `<button class="btn sm" id="signout">Sign out</button>` : ""}</div></div></header>
  <main class="wrap">${view}</main>${S.sel ? drawerHtml() : ""}`;
  if (keep != null) { const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(keep, keep); } }
}

/* ---------- interaction ---------- */
async function openCard(id, quiet) {
  S.sel = id; if (!quiet) { S.detail = null; render(); }
  try { const d = await api.detail(id); if (S.sel === id) { S.detail = d; const cb = $("#cbody"), keepC = cb ? cb.value : "", dn = $("#dnote"), keepD = dn ? dn.value : ""; render(); if ($("#cbody")) $("#cbody").value = keepC; if ($("#dnote")) $("#dnote").value = keepD; } } catch (e) { toast(errMsg(e), true); }
}
function closeCard() { S.sel = null; S.detail = null; render(); }
function setTab(t, push) { if (!TABS.some(x => x[0] === t)) t = "mywork"; S.tab = t; S.q = ""; S.status = t === "found" ? "everything" : "active"; S.sel = null; S.detail = null; if (push) { try { history.replaceState(null, "", "#" + t); } catch (e) {} } try { localStorage.setItem("board.tab", t); } catch (e) {} render(); window.scrollTo(0, 0); }

document.addEventListener("click", async e => {
  const el = s => e.target.closest(s); let t;
  if ((t = el("[data-tick]"))) { e.stopPropagation(); const c = S.cards.find(x => x.id === t.dataset.tick); if (!c) return; const to = c.status === "done" ? "open" : "done"; return act(() => api.setStatus(c.id, to), to === "done" ? "Marked done" : "Reopened"); }
  if ((t = el("[data-tab]"))) return setTab(t.dataset.tab, true);
  if ((t = el("[data-person]"))) { S.person = t.dataset.person; return render(); }
  if ((t = el("[data-status]"))) { S.status = t.dataset.status; return render(); }
  if (el("[data-close]")) return closeCard();
  if ((t = el("[data-write]"))) return act(() => api.requestReport(t.dataset.write), "Queued. The next run will write the report.");
  if ((t = el("[data-now]"))) return act(() => api.writeNow(t.dataset.now), "Marked urgent. The report writer takes it on its next run.");
  if (el("[data-addopen]")) { S.adding = true; S.af = AF0(); render(); const i = document.querySelector('[data-af="target"]'); if (i) i.focus(); return; }
  if (el("[data-addcancel]")) { S.adding = false; S.af = null; return render(); }
  if ((t = el("[data-finish]"))) return act(() => api.finishDeal(t.dataset.finish), "Sent for the final check.");
  if ((t = el("[data-claim]"))) return act(() => api.claimDeal(t.dataset.claim), "It's yours. The report writer will leave it alone.");
  if ((t = el("[data-rm]"))) { S.removing = t.dataset.rm; render(); const i = $("#rmreason"); if (i) i.focus(); return; }
  if (el("[data-rmcancel]")) { S.removing = null; return render(); }
  if ((t = el("[data-rmgo]"))) { const reason = $("#rmreason").value.trim(); S.removing = null; return act(() => api.excludeDeal(t.dataset.rmgo, reason), "Removed from the list"); }
  if ((t = el("[data-restore]"))) return act(() => api.restoreDeal(t.dataset.restore), "Back on the list");
  if (el("#signout")) { await sb.auth.signOut(); return; }
  if (S.sel) {
    const id = S.sel;
    if ((t = el("[data-set]"))) return act(() => api.setStatus(id, t.dataset.set), { done: "Marked done", stuck: "Marked stuck", open: "Reopened", verified: "Verified" }[t.dataset.set]);
    if (el("[data-pick]")) return act(() => api.pick(id), "It's yours. Find it under My work.");
    if ((t = el("[data-decide]"))) { const note = $("#dnote").value.trim(); return act(() => api.decide(id, t.dataset.decide, note), t.dataset.decide === "write" ? "Queued for a report" : "Skipped and logged"); }
    if (el("[data-reassign]")) { const to = $("#rto").value; return act(() => api.reassign(id, to), "Reassigned"); }
    if (el("[data-comment]")) { const b = $("#cbody").value.trim(); if (!b) return; $("#cbody").value = ""; return act(() => api.comment(id, b)); }
    if (el("[data-upload]")) return $("#ffile").click();
    if (el("[data-copydraft]")) { const tx = $("#drafttext").textContent; try { await navigator.clipboard.writeText(tx); toast("Draft copied"); } catch (e) { const r = document.createRange(); r.selectNodeContents($("#drafttext")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Text selected. Press Ctrl+C to copy."); } return; }
  }
  if ((t = el("[data-card]"))) return openCard(t.dataset.card);
});
document.addEventListener("change", e => {
  if (e.target.id === "ffile" && e.target.files[0] && S.sel) { const f = e.target.files[0], kind = $("#fkind").value, id = S.sel; if (f.size > 50 * 1024 * 1024) return toast("That file is over 50 MB.", true); toast("Uploading " + f.name + "…"); return act(() => api.attach(id, f, kind), "Attached " + f.name); }
  if (e.target.dataset.assign && e.target.value) { const v = e.target.value, m = v === "writer" ? null : v, who = m ? S.team.find(x => x.id === m).name : null; return act(() => api.assignDeal(e.target.dataset.assign, m), who ? "Assigned to " + who + ". The report writer will leave it alone." : "Back in the report writer's queue."); }
  if (e.target.dataset.owner) return act(() => api.setDealOwner(e.target.dataset.owner, e.target.value || null), "Responsible person updated");
  if (e.target.id === "viewas") { S.me = S.team.find(m => m.id === e.target.value); S.person = "all"; render(); }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; render(); } if (e.target.dataset && e.target.dataset.af && S.af) S.af[e.target.dataset.af] = e.target.value; });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "rmreason") { e.preventDefault(); const b = document.querySelector("[data-rmgo]"); if (b) b.click(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.sel) return closeCard();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-card],[data-tick]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id === "addf") {
    e.preventDefault(); const f = { ...S.af }; ["target", "bidder", "seller", "country", "currency", "url"].forEach(k => f[k] = (f[k] || "").trim());
    if (!f.target || !f.country) return toast("Enter the target and its country.", true);
    try { await api.addDeal(f); S.adding = false; S.af = null; S.q = ""; toast({ queue: "Added and queued for the report writer.", now: "Added. The report writer takes it on its next run.", mine: "Added in your name.", log: "Added to the list." }[f.action]); await reload(true); } catch (err) { toast(errMsg(err), true); }
    return;
  }
  if (e.target.id !== "login") return; e.preventDefault();
  const email = $("#lemail").value.trim().toLowerCase();
  S.authMsg = { text: "Sending…" }; render();
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  S.authMsg = error ? { err: true, text: errMsg(error) } : { text: "Check your inbox for the sign-in link, then open it on this device." }; render();
  if ($("#lemail")) $("#lemail").value = email;
});

/* ---------- start ---------- */
async function start() {
  let tab = (location.hash || "").replace("#", ""); if (!TABS.some(x => x[0] === tab)) { try { tab = localStorage.getItem("board.tab") || "mywork"; } catch (e) { tab = "mywork"; } }
  S.tab = TABS.some(x => x[0] === tab) ? tab : "mywork"; S.status = S.tab === "found" ? "everything" : "active";
  if (!LIVE) { S.team = demo.team; S.me = demo.team[0]; return reload(); }
  sb = supabase.createClient(CONFIG.url, CONFIG.key);
  let chan = null;
  sb.auth.onAuthStateChange((ev, session) => {
    const was = S.session && S.session.user.id; S.session = session;
    if (!session) { S.me = null; S.loading = false; if (chan) { sb.removeChannel(chan); chan = null; } render(); return; }
    if (was === session.user.id && S.me) return;
    S.loading = true; render();
    setTimeout(async () => {
      try {
        const d = await liveApi.load(); applyData(d);
        S.me = S.everyone.find(m => (m.email || "").toLowerCase() === (session.user.email || "").toLowerCase()) || null;
      } catch (e) { toast(errMsg(e), true); }
      S.loading = false; render();
      if (S.me && !chan) chan = sb.channel("board").on("postgres_changes", { event: "*", schema: "public", table: "cards" }, reloadSoon).on("postgres_changes", { event: "*", schema: "public", table: "card_comments" }, reloadSoon).on("postgres_changes", { event: "*", schema: "public", table: "deals" }, reloadSoon).on("postgres_changes", { event: "*", schema: "public", table: "absences" }, reloadSoon).subscribe();
    }, 0);
  });
  setInterval(() => { if (S.me && document.visibilityState === "visible") reload(true); }, 5 * 60 * 1000);
}
start();
</script>
</body>
</html>
